<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FIP settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <p class="wordmark">FIP</p>
      <h1>Stations</h1>
      <p class="lede">
        Choose which stations appear in the player, and the color used for
        each one. All stations are on until you turn one off.
      </p>
      <div id="list"></div>
      <div class="actions">
        <button type="button" id="show-all">Show all</button>
        <button type="button" id="reset-colors">Reset colors</button>
      </div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
